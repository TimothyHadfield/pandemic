<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pandemic Lab</title>
<meta name="description" content="Play Pandemic with computer teammates or friends online, with exact infection odds, a planner and a real-table tracker.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pandemic Lab">
<link rel="stylesheet" href="css/table.css?v=2">
<link rel="stylesheet" href="css/coach.css?v=1">
<link rel="stylesheet" href="css/profile.css?v=1">
<style>
  :root {
    --bg: #0f1117; --bg-soft: #161923; --card: #1a1e2b; --card-hover: #212636; --line: #2a3042;
    --text: #e8eaf0; --muted: #969db4; --accent: #6ea8fe; --accent-warm: #f0b354;
    --good: #6ee7a8; --bad: #f08c8c;
    --c-blue: #4f8ff7; --c-yellow: #f2c94c; --c-black: #3a3d4a; --c-red: #e5484d;
    --ocean: #0d1b2c; --land: #1b2a33;
    --radius: 12px; --tabbar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .view { display: none; flex: 1; min-height: 0; padding: 8px 10px 6px; }
  .view.on { display: flex; flex-direction: column; }

  /* ------------------------------------------------ tab bar (phone bottom, laptop top) */
  nav.tabs { order: 2; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #12151e; border-top: 1px solid var(--line); flex: none; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .brand { display: none; }
  @media (min-width: 900px) {
    nav.tabs { order: 0; height: 52px; padding: 0 16px; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; gap: 6px; }
    nav.tabs .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; margin-right: 22px; color: var(--text); text-decoration: none; }
    nav.tabs .brand img { width: 26px; height: 26px; border-radius: 6px; }
    nav.tabs button { flex: none; flex-direction: row; font-size: 14px; padding: 0 14px; gap: 8px; border-radius: 9px; height: 38px; align-self: center; }
    nav.tabs button.on { background: rgba(110,168,254,.12); }
    nav.tabs button svg { width: 18px; height: 18px; }
    .view { padding: 12px 16px 12px; }
  }

  /* ------------------------------------------------ common bits */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; cursor: pointer;
    font-weight: 650; transition: background .12s, transform .08s, border-color .12s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #24180a; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 34px; padding: 0 10px; font-size: 13.5px; border-radius: 8px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; vertical-align: -1px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 44px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 650; font-size: 14px; padding: 4px 6px; }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; vertical-align: middle; flex: none; }
  .pop { position: fixed; z-index: 90; max-width: min(320px, calc(100vw - 32px)); background: #232838; border: 1px solid #3a4258; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2f3548; border-radius: 14px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .pct { font-variant-numeric: tabular-nums; font-weight: 750; }
  .num { font-variant-numeric: tabular-nums; }
  select { -webkit-appearance: none; appearance: none; padding-right: 28px !important;
    background-image: linear-gradient(45deg, transparent 50%, #969db4 50%), linear-gradient(135deg, #969db4 50%, transparent 50%);
    background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; }
  select, .txt { font: inherit; background-color: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-height: 40px; padding: 0 10px; }
  .txt { font-size: 16px; width: 100%; min-width: 0; }
  .txt.code { text-transform: uppercase; letter-spacing: .2em; font-weight: 700; flex: 1; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2a3042; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 95; animation: up .2s; max-width: calc(100vw - 32px); }
  @media (min-width: 900px) { .toast { bottom: 24px; } }
  .confirm-back { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .confirm-back .panel { max-width: 360px; width: 100%; }
  .sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
  .sheet { width: 100%; max-width: 520px; max-height: 80dvh; background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; animation: up .22s ease-out; }
  @media (min-width: 900px) { .sheet-back { align-items: center; } .sheet { border-radius: 16px; max-width: 460px; } }
  .sheet h3 { margin: 0; font-size: 16px; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ------------------------------------------------ the map */
  /* the board lies on the table: past its printed edge you see the table top (drawn in js/art.js) */
  .map { position: relative; background: transparent; border: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .map svg { display: block; width: 100%; height: 100%; }
  .map .zctl { position: absolute; left: 6px; top: 6px; display: flex; gap: 4px; z-index: 1; }
  .map .zbtn { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(10,14,22,.5); color: #c9d4e4; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 4px rgba(0,0,0,.35); transition: opacity .2s, color .2s, border-color .2s; }
  .map .zbtn[data-z="fit"], .map .zbtn[data-z="out"] { opacity: .45; }
  .map.zoomed .zbtn[data-z="fit"], .map.zoomed .zbtn[data-z="out"] { opacity: 1; }
  .map.zoomed .zbtn[data-z="fit"] { color: var(--accent); border-color: var(--accent); }
  svg .link { stroke: #c6d6ea; stroke-opacity: .42; stroke-width: 1.4; }
  svg .city-halo { fill: #0b1420; fill-opacity: .85; }
  svg .city-dot { stroke: #eef2f7; stroke-width: 1.7; }
  svg .city-dot.blk { stroke: #cfd4e0; }
  svg .city-shine { fill: rgba(255,255,255,.32); pointer-events: none; }
  svg .ring-sel { stroke: #fff; stroke-width: 2.5; fill: none; }
  svg .lbl { fill: #e3e9f3; font-weight: 650; paint-order: stroke; stroke: #0b1420; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
  svg .ptitle { fill: #d9c48f; font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-anchor: middle; pointer-events: none; }
  svg .pnum { fill: #e8eef5; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  svg .pcard { fill: #fff; font-size: 7px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
  svg .pcard.dk { fill: #2a2006; }
  svg .pcard.sm { font-size: 5.5px; letter-spacing: .1em; fill-opacity: .7; }
  svg .marker { transition: transform .6s cubic-bezier(.3,.7,.3,1); }
  svg .pawn { transition: transform .55s cubic-bezier(.3,.7,.3,1); }
  svg .newcube { animation: cubein .45s ease-out both; transform-box: fill-box; transform-origin: center; }
  @keyframes cubein { from { transform: translateY(-14px) scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
  svg .boom { animation: boom 1.1s ease-out both; transform-box: fill-box; transform-origin: center; }
  @keyframes boom { from { transform: scale(.4); opacity: .95; } to { transform: scale(2.6); opacity: 0; } }
  svg .reach { fill: none; stroke: #6ea8fe; stroke-width: 2; stroke-dasharray: 3 3; }
  svg .riskring { fill: none; stroke-width: 3; }

  /* ------------------------------------------------ cards: real 63:88 cards (js/table.js + css/table.css), our own faces */
  .pc { --card-paper: #f4f1e8; display: flex; flex-direction: column; overflow: hidden; padding: 0; margin: 0; text-align: left;
    font: inherit; color: #fff; cursor: pointer; user-select: none; -webkit-user-select: none; outline: 2px solid transparent; outline-offset: 1px; }
  span.pc { cursor: default; }
  .pc::before { content: ""; position: absolute; inset: calc(var(--card-w) * .05); border-radius: calc(var(--card-w) * .045);
    background: linear-gradient(165deg, var(--hi) 0%, var(--cc) 48%, var(--lo) 100%); }
  .pc > * { position: relative; }
  .pc.c0 { --cc: #2f6fd6; --hi: #5c95f0; --lo: #1c4791; }
  .pc.c1 { --cc: #e4b52f; --hi: #f6d66e; --lo: #b88a12; color: #2a2006; }
  .pc.c2 { --cc: #3a3d4a; --hi: #5d6172; --lo: #1d1f26; }
  .pc.c3 { --cc: #d8393f; --hi: #f06a6e; --lo: #9a1e24; }
  .pc.ev { --cc: #e3a63f; --hi: #f6cd76; --lo: #b57a1c; color: #3a2606; }
  .pc.epi { --cc: #2f7a45; --hi: #4fa265; --lo: #1b4a2a; }
  .pc-nm { font-weight: 800; font-size: calc(var(--card-w) * .155); line-height: 1.04; padding: 12% 10% 0; letter-spacing: -.01em;
    -webkit-hyphens: auto; hyphens: auto; overflow-wrap: anywhere; max-height: 3.4em; overflow: hidden; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .pc.c1 .pc-nm, .pc.ev .pc-nm { text-shadow: none; }
  .pc-map { display: block; width: 80%; margin: auto auto 0; fill: rgba(255,255,255,.3); }
  .pc-map circle { fill: #fff; stroke: rgba(0,0,0,.45); stroke-width: 9; }
  .pc.c1 .pc-map { fill: rgba(70,45,0,.28); }
  .pc.c1 .pc-map circle { fill: #2a2006; stroke: #fff6d8; }
  .pc.ev .pc-nm { font-size: calc(var(--card-w) * .13); }
  .pc-pp { font-size: calc(var(--card-w) * .12); font-weight: 750; opacity: .82; padding: 5% 10% 11%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-ic { display: block; width: 44%; margin: auto; }
  .pc.sel { outline-color: var(--accent-warm); }
  /* a card seen from across the table: colour only */
  .pc.mini > * { display: none; }
  /* infection card face (flips): the city on a stripe of its colour, on green stock */
  .ic-card { --card-paper: #f4f1e8; display: flex; flex-direction: column; justify-content: center; overflow: hidden; color: #fff; }
  .ic-card::before { content: ""; position: absolute; inset: calc(var(--card-w) * .05); border-radius: calc(var(--card-w) * .045); background: linear-gradient(170deg, #2c6a46, #173b28); }
  .ic-card > * { position: relative; }
  .ic-strip { display: flex; align-items: center; gap: 4%; padding: 7% 9%; margin: 0 calc(var(--card-w) * .05); background: var(--sc); }
  .ic-strip b { font-size: calc(var(--card-w) * .15); line-height: 1.05; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: anywhere; }
  .ic-strip i { display: none; }
  .ic-card.c0 { --sc: #2f6fd6; } .ic-card.c1 { --sc: #e4b52f; color: #2a2006; } .ic-card.c2 { --sc: #3a3d4a; } .ic-card.c3 { --sc: #d8393f; }
  .ic-card.c1 .ic-foot { color: #fff; }
  .ic-foot { position: absolute; left: 0; right: 0; bottom: 11%; text-align: center; font-size: calc(var(--card-w) * .1); font-weight: 800; letter-spacing: .14em; opacity: .65; }
  /* card backs: player cards blue, infection cards green, our own emblems */
  .pan-pback { --back: #1f4378; background-image: radial-gradient(circle at 50% 50%, transparent 0 17%, rgba(255,255,255,.6) 17.5% 20%, transparent 20.5%),
    linear-gradient(90deg, transparent calc(50% - .5px), rgba(255,255,255,.45) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 1px, transparent 1px 5px); background-size: 100% 100%, 46% 30%, auto; background-position: center; background-repeat: no-repeat, no-repeat, repeat; }
  .pan-iback { --back: #2d6b45; background-image: radial-gradient(circle at 50% 50%, rgba(220,255,225,.65) 0 6%, transparent 6.5% 14%, rgba(220,255,225,.45) 14.5% 17%, transparent 17.5%),
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.07) 0 8deg, transparent 8deg 22deg); }
  /* role card: the role's colour (= its pawn) with its sign and name */
  .rc { --card-paper: #f4f1e8; display: flex; flex-direction: column; align-items: center; overflow: hidden; color: #fff; flex: none; }
  .rc::before { content: ""; position: absolute; inset: calc(var(--card-w) * .05); border-radius: calc(var(--card-w) * .045);
    background: linear-gradient(170deg, rgba(255,255,255,.28), rgba(0,0,0,.28)), var(--rc); }
  .rc > * { position: relative; }
  .rc-ic { width: 56%; aspect-ratio: 1; margin-top: 16%; border-radius: 50%; background: rgba(255,255,255,.88); color: #1b1d24; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .rc-ic svg { width: 64%; height: 64%; }
  .rc-nm { margin-top: auto; padding: 0 6% 12%; font-size: calc(var(--card-w) * .15); font-weight: 800; text-align: center; line-height: 1.05; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .rc.turn { box-shadow: 0 0 0 2px var(--accent-warm), 0 0 14px rgba(240,179,84,.55), 0 2px 6px rgba(0,0,0,.4); }

  /* ------------------------------------------------ play: the table from your seat */
  /* wood table top under the whole Play view (js/table.js surface); helpers sit on it as dark glass panels */
  #v-play { --glass: rgba(10,14,22,.66); --glass-line: rgba(255,255,255,.09); color: var(--text); }
  #game { flex: 1; min-height: 0; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(140px, 1fr) auto auto auto auto;
    grid-template-areas: "status" "players" "map" "info" "risk" "hand" "acts"; }
  #g-side { display: none; }
  .status { grid-area: status; display: flex; align-items: center; gap: 6px; min-width: 0; height: 40px; }
  .stat { display: flex; align-items: center; gap: 4px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 8px; padding: 0 8px; height: 40px; font-size: 12.5px; white-space: nowrap; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,.3); }
  .stat b { font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .stat svg { width: 15px; height: 15px; flex: none; }
  .vials { display: flex; gap: 3px; }
  .vial { width: 11px; height: 17px; border-radius: 3px 3px 5px 5px; border: 1.5px solid; }
  .icon-btn { width: 42px; height: 40px; border-radius: 8px; border: 1px solid var(--glass-line); background: var(--glass); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0; box-shadow: 0 2px 5px rgba(0,0,0,.3); }
  .icon-btn svg { width: 18px; height: 18px; }
  #g-map { grid-area: map; width: 100%; height: 100%; min-height: 0; }
  .info { grid-area: info; background: var(--glass); border: 1px solid var(--glass-line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 5px 8px; height: 62px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .info.mine { border-left-color: var(--accent-warm); }
  .info.alert { border-left-color: var(--bad); }
  .info .p1 { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .info .p2 { font-size: 12.5px; color: #b4bbd0; display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; align-items: center; scrollbar-width: none; }
  .info .p2::-webkit-scrollbar { display: none; }
  .info .p2 .btn { flex: none; }
  .info.wrap { height: auto; min-height: 62px; padding: 6px 8px; }
  .info.wrap .p2 { flex-wrap: wrap; white-space: normal; overflow: visible; row-gap: 4px; }
  /* only whole chips show (js fitRisk hides the rest); "All N" at the end opens the full list */
  .risk { grid-area: risk; display: flex; align-items: center; gap: 6px; height: 40px; overflow: hidden; white-space: nowrap; }
  .rchip { display: inline-flex; align-items: center; gap: 4px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 7px; padding: 0 9px; height: 40px; font-size: 13px; cursor: pointer; flex: none; color: inherit; font-family: inherit; }
  .rchip.more { margin-left: auto; font-weight: 700; color: var(--accent); }
  .rchip .dot { width: 8px; height: 8px; border-radius: 50%; }
  /* teammates' seats at the far side: role card + held cards */
  .players { grid-area: players; display: flex; gap: 6px; min-width: 0; height: 48px; }
  .pchip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border-radius: 10px; padding: 3px 7px 3px 4px; font-size: 12px; cursor: pointer;
    background: transparent; border: 1px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .pchip.turn { border-color: var(--accent-warm); box-shadow: 0 0 0 1px rgba(240,179,84,.35), 0 0 16px rgba(240,179,84,.22); }
  .pchip .rc { --card-w: 29px; }
  .pchip .rc-nm { display: none; }
  .pchip .sc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .pchip .snm { display: flex; gap: 5px; align-items: baseline; font-weight: 700; color: #f3efe4; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .pchip .nmx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
  .pchip .nmx .muted { color: #c9c0ab; font-weight: 600; }
  .pchip b { font-variant-numeric: tabular-nums; }
  .pchip .sh { display: flex; align-items: flex-end; height: 19px; padding-left: 1px; --card-w: 13px; }
  .pchip .sh > .tbl-card { transform: rotate(var(--r, 0deg)); transform-origin: 50% 100%; box-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .pchip .sh > .tbl-card + .tbl-card { margin-left: calc(var(--card-w) * -.42); }
  .pchip .sh > .tbl-back { --frame: 1.2px; }
  /* your seat: your role card and your hand held as a fan */
  .hand { grid-area: hand; display: flex; gap: 8px; align-items: flex-end; min-width: 0; }
  #g-me { flex: none; cursor: pointer; margin-bottom: 4px; }
  #g-me .rc { --card-w: 42px; }
  #g-fan { flex: 1; min-width: 0; --card-w: 60px; }
  /* fixed height (card + lift room): the kit's fan sets its own height on resize, which would loop with the board's auto-fit */
  #g-fan { height: calc(var(--card-w) * 88 / 63 + 20px) !important; }
  #g-fan.fan-empty { display: flex; align-items: center; }
  .hand .empty { color: #c9c0ab; font-size: 12.5px; }
  .acts { grid-area: acts; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 44px; }
  .acts::-webkit-scrollbar { display: none; }
  .acts .btn { flex: 1 0 auto; padding: 0 11px; box-shadow: 0 2px 5px rgba(0,0,0,.3); }
  .acts .btn:not(.primary):not(.warm) { background: rgba(16,20,30,.82); border-color: var(--glass-line); }
  .acts > .muted { color: #c9c0ab; }
  .left-pips { display: inline-flex; gap: 3px; }
  .left-pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-warm); display: inline-block; }
  .left-pips i.off { background: #3a4258; }
  /* phone held upright: the board runs edge to edge and is exactly as tall as it needs (no empty sea band); the spare height goes to your hand */
  @media (max-width: 899px) and (orientation: portrait) {
    #game { grid-template-rows: auto auto minmax(0, calc(50vw + 6px)) auto auto minmax(0, 1fr) auto; }
    #g-map { width: calc(100% + 20px); margin: 0 -10px; }
    #g-fan { --card-w: 66px; }
  }
  /* short phones (iPhone SE and the like): a little tighter so the buttons keep their full height */
  @media (max-width: 899px) and (max-height: 600px) and (orientation: portrait) {
    #game { gap: 5px; }
    .info { height: 54px; }
    .risk, .rchip { height: 36px; }
    .players { height: 44px; }
    #g-fan { --card-w: 50px; }
    #g-me .rc { --card-w: 36px; }
  }
  /* phone on its side: the board on the left, everything else beside it */
  @media (max-width: 899px) and (orientation: landscape) and (max-height: 520px) {
    :root { --tabbar: 42px; }
    nav.tabs button { flex-direction: row; gap: 6px; }
    .view { padding: 5px 10px 4px; }
    /* the board takes the left side's full width (it is width-bound), your hand sits under it instead of beside it */
    #game { grid-template-columns: minmax(0, 1fr) 250px; gap: 5px; grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      grid-template-areas: "status players" "map info" "map risk" "map acts" "hand acts"; }
    .acts { flex-wrap: wrap; align-content: flex-end; overflow: visible; }
    /* three teammates in the narrower column: a name cut to one letter says nothing, the role card already shows who it is */
    .pchip[style*="--n:3"] .nmx { display: none; }
    .status .stat { padding: 0 6px; }
    .info { height: 56px; }
    .risk, .rchip { height: 34px; }
    .acts .btn { min-height: 38px; }
    #g-fan { --card-w: 50px; }
    #g-me .rc { --card-w: 34px; }
    .players { height: 40px; }
    .pchip .rc { --card-w: 25px; }
  }

  @media (min-width: 900px) {
    #game { grid-template-columns: minmax(0, 1fr) 290px 330px; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
      grid-template-areas: "players players status" "map map side" "hand acts side"; align-content: stretch; }
    #g-map { aspect-ratio: auto; height: 100%; min-height: 0; }
    .info, .risk { display: none; }
    .status { gap: 5px; justify-content: flex-end; }
    .status .stat { padding: 0 7px; }
    .players { height: auto; gap: 10px; }
    .pchip { padding: 6px 10px 6px 6px; gap: 9px; flex: 0 1 420px; }
    .pchip .rc { --card-w: 46px; }
    .pchip .rc-nm { display: block; }
    .pchip .snm { font-size: 13.5px; }
    .pchip .sh { --card-w: 42px; height: 60px; }
    .pchip .sh > .tbl-card + .tbl-card { margin-left: calc(var(--card-w) * var(--ov, -.12)); }
    .pchip[style*="--n:2"] .sh { --ov: -.4; }
    .pchip[style*="--n:3"] .sh { --ov: -.62; }
    .pchip .sh > .pc.mini > .pc-nm { display: block; font-size: 7.4px; padding: 10% 7% 0; }
    #g-side { display: flex; grid-area: side; flex-direction: column; gap: 8px; min-height: 0; }
    #g-side .info { display: flex; height: auto; min-height: 92px; }
    #g-side .info .p2 { flex-wrap: wrap; white-space: normal; overflow: visible; }
    #g-side .panel { background: var(--glass); border-color: var(--glass-line); }
    #g-side .oddsbox { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #g-side .logbox { flex: .8; min-height: 0; display: flex; flex-direction: column; }
    #g-side .oddsbox .scroll, #g-side .logbox .scroll { flex: 1; margin-top: 6px; }
    #g-me .rc { --card-w: 74px; }
    #g-fan { --card-w: 92px; }
    #g-fan > .pc:hover:not(.is-up) { --up: 6px; }
    .acts { flex-wrap: wrap; align-content: flex-end; justify-content: flex-end; overflow: visible; }
    .acts .btn { flex: 0 0 auto; }
  }
  table.odds { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.odds th { text-align: right; color: var(--muted); font-weight: 600; font-size: 11px; padding: 2px 4px; position: sticky; top: 0; background: var(--card); }
  table.odds th:first-child, table.odds td:first-child { text-align: left; }
  table.odds td { text-align: right; padding: 3px 4px; border-top: 1px solid #222838; }
  ul.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
  ul.log li { color: var(--muted); }
  ul.log li.hot { color: var(--bad); }
  ul.log li .r { color: #59607a; font-variant-numeric: tabular-nums; margin-right: 5px; }
  .cubes-mini { display: inline-flex; gap: 2px; }
  .cubes-mini i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* ------------------------------------------------ setup / online */
  .setup { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; max-width: 720px; width: 100%; margin: 0 auto; overflow-y: auto; }
  .setup > * { flex-shrink: 0; }
  .hero { display: flex; align-items: center; gap: 12px; }
  .hero img { width: 46px; height: 46px; border-radius: 10px; }
  .hero h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .hero p { margin: 0; color: var(--muted); font-size: 13px; }
  .setup .panel { display: flex; flex-direction: column; gap: 9px; }
  @media (min-width: 900px) {
    .setup { justify-content: center; gap: 14px; padding-bottom: 6vh; }
    .setup .panel { padding: 18px; gap: 12px; }
    .hero img { width: 56px; height: 56px; }
    .hero h1 { font-size: 30px; }
    .hero p { font-size: 14.5px; }
    .setup .seg button { min-height: 54px; font-size: 16px; }
    .setup .seg button small { font-size: 12px; margin-top: 2px; }
    .setup .btn { min-height: 50px; font-size: 16px; }
  }
  .code-big { font-size: 38px; font-weight: 800; letter-spacing: .2em; padding-left: .2em; color: var(--accent-warm); font-variant-numeric: tabular-nums; }
  .seats { display: flex; flex-direction: column; gap: 6px; }
  .seatrow { display: flex; align-items: center; gap: 9px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px 5px 10px; font-size: 14px; min-height: 42px; }
  .seatrow .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .rolepick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .rolepick button { min-height: 52px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 9px; font-size: 11.5px; font-weight: 650; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 5px 2px; line-height: 1.1; text-align: center; min-width: 0;
    transition: border-color .12s, background .12s, transform .08s; }
  .rolepick button:active { transform: scale(.97); }
  .rolepick button svg { width: 17px; height: 17px; }
  .rolepick button[aria-pressed="true"] { border-color: var(--accent); background: rgba(110,168,254,.12); }
  .rolepick button i { width: 15px; height: 15px; border-radius: 50%; flex: none; }
  @media (min-width: 900px) { .rolepick button { flex-direction: row; justify-content: flex-start; gap: 8px; padding: 4px 12px; font-size: 13.5px; min-height: 46px; } }

  /* ------------------------------------------------ table tracker */
  .tt { flex: 1; min-height: 0; display: grid; gap: 7px; grid-template-rows: auto auto auto minmax(0, 1fr); }
  .tt .bar { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tt .bar::-webkit-scrollbar { display: none; }
  /* the 12 rows share the free height (bigger taps), from 30px up to 46px */
  .tt > .scroll { display: flex; flex-direction: column; }
  .tgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; align-content: stretch; flex: 1 0 auto; }
  .tcol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .tc { position: relative; display: flex; align-items: center; gap: 3px; flex: 1 1 30px; min-height: 30px; max-height: 46px; border-radius: 7px; background: var(--bg-soft); border: 1px solid var(--line);
    padding: 0 4px 0 6px; font-size: 11px; cursor: pointer; overflow: hidden; min-width: 0; transition: background .15s; }
  .tc .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
  .tc .tp { font-variant-numeric: tabular-nums; font-weight: 750; font-size: 10.5px; }
  .tc .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .tc.disc { opacity: .5; }
  .tc.gone { opacity: .25; text-decoration: line-through; }
  .tc .cb { display: flex; gap: 1px; }
  .tc .cb i { width: 5px; height: 9px; border-radius: 1px; display: block; }
  .tc.flash { animation: flash .5s; }
  @keyframes flash { from { background: rgba(110,168,254,.4); } to { background: var(--bg-soft); } }
  .modehint { font-size: 12px; line-height: 1.25; color: var(--accent-warm); flex: 1 1 140px; min-width: 0; white-space: normal; }
  .tt .bar.wrap { overflow: visible; }
  @media (min-width: 900px) {
    .tt { grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto auto auto minmax(0, 1fr); }
    .tt .tside { grid-column: 2; grid-row: 1 / 5; }
    .tc { min-height: 34px; max-height: 56px; font-size: 14px; padding: 0 8px 0 10px; }
    .tc .tp { font-size: 13px; }
    .tc .cb i { width: 6px; height: 11px; }
    .tgrid { gap: 8px; }
  }

  /* ------------------------------------------------ study + settings */
  .study { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; }
  .study > * { flex: none; }
  .chart svg { width: 100%; height: 130px; display: block; }
  table.wr { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.wr th { color: var(--muted); font-weight: 600; font-size: 11px; padding: 3px 4px; text-align: center; }
  table.wr td { text-align: center; padding: 5px 4px; border-top: 1px solid #222838; }
  table.wr td:first-child, table.wr th:first-child { text-align: left; }
  @media (min-width: 900px) {
    .study { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .study .s-wide { grid-column: 1 / 3; }
    .study > .panel { align-self: start; max-height: 100%; }
    table.wr { font-size: 15px; }
    table.wr th { font-size: 12px; }
    table.wr td { padding: 9px 6px; }
    .chart svg { height: 180px; }
  }
  .set { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 9px; }
  .setrow { display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .setrow .grow b { display: block; font-weight: 650; }
  .setrow .grow span { font-size: 12.5px; color: var(--muted); }
  .setrow + .setrow { border-top: 1px solid #232839; padding-top: 8px; }
  .ver { color: #59607a; font-size: 12px; text-align: center; }
  /* Sound & effects rows (js/fx.js) in the same look as .setrow */
  .fx-set .fx-row { min-height: 46px; padding: 8px 0 0; border-top: 1px solid #232839; gap: 10px; }
  .fx-set .fx-row:first-child { border-top: 0; }
  .fx-set .fx-lab { font-weight: 650; }
  .fx-set .fx-why { font-size: 12.5px; color: var(--muted); }
  .fx-set .switch { width: 48px; height: 28px; }
  .fx-set .switch span { background: #2f3548; border-radius: 14px; }
  .fx-set .switch span::after { width: 22px; height: 22px; }
  .fx-set .switch input:checked + span { background: var(--accent); }
  .fx-set .switch input:checked + span::after { transform: translateX(20px); }
  .fx-set .seg { min-width: 200px; gap: 6px; background: none; border: 0; padding: 0; }
  .fx-set .seg button { flex: 1; min-height: 36px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font-size: 14px; padding: 4px 6px; }
  .fx-set .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .fx-set .q { width: 20px; height: 20px; background: var(--bg-soft); font-size: 12px; }
  .fx-set .fx-test { min-height: 36px; }
  /* Animations off: the game's own motion is instant too; Fast: about half as long */
  html.fx-still *, html.fx-still *::before, html.fx-still *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition-duration: 0s !important; }
  html.fx-fast .pc.deal { animation-duration: .18s; }
  html.fx-fast .flipstrip .fc { animation-duration: .22s; }
  html.fx-fast svg .newcube { animation-duration: .25s; }
  html.fx-fast svg .boom { animation-duration: .6s; }
  html.fx-fast svg .pawn { transition-duration: .3s; }
  html.fx-fast .banner, html.fx-fast .banner > * { animation-duration: .17s; }
  .ver a { color: #59607a; white-space: nowrap; }
  /* key moments: a plate lands on the board (Epidemic, cure), a shock ring spreads from an outbreak */
  .moment { position: fixed; z-index: 55; pointer-events: none; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 12px 22px 11px; border-radius: 12px; background: linear-gradient(160deg, color-mix(in srgb, var(--mc) 78%, #fff 8%), color-mix(in srgb, var(--mc) 70%, #000 30%));
    border: 3px solid #f4efe2; box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.25); color: #fff; text-align: center; max-width: 86vw;
    animation: moment 1.7s cubic-bezier(.2,.8,.3,1) both; }
  .moment .mo-t { font-size: clamp(22px, 6vw, 34px); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .moment .mo-s { font-size: 13px; font-weight: 600; opacity: .92; }
  .moment.lite { color: #10131a; }
  .moment.lite .mo-t { text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  @keyframes moment { 0% { opacity: 0; scale: 1.9; rotate: -8deg; } 14% { opacity: 1; scale: .94; rotate: -2deg; } 20% { scale: 1.03; } 26% { scale: 1; }
    80% { opacity: 1; scale: 1; } 100% { opacity: 0; scale: .96; translate: -50% -60%; } }
  .shock { position: fixed; z-index: 54; pointer-events: none; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
    border: 3px solid var(--mc); box-shadow: 0 0 14px var(--mc); animation: shock .9s ease-out both; }
  @keyframes shock { from { transform: scale(.4); opacity: 1; } to { transform: scale(5.5); opacity: 0; } }
  html.fx-fast .moment { animation-duration: .95s; }
  html.fx-fast .shock { animation-duration: .5s; }
  /* the end of the game: a card laid on the table (the rest of the table dims), New game / Review under it */
  .banner { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 16px 16px calc(var(--tabbar) + 16px); background: rgba(5,7,12,.5); animation: fade .2s ease-out; }
  .banner > * { animation: endin .32s ease-out both; }
  @media (min-width: 900px) { .banner { padding: 16px; } }
  @keyframes endin { from { transform: translateY(14px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .banner .endcard { --card-w: min(210px, 54vw, 32vh); rotate: -2deg; text-align: center; cursor: default;
    box-shadow: 0 2px 3px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.6); }
  .endcard.win { --cc: #2f8f55; --hi: #5cbf80; --lo: #1a5532; }
  .endcard.lose { --cc: #a8282e; --hi: #d9535a; --lo: #5c1216; }
  .endcard .pc-nm { font-size: calc(var(--card-w) * .15); padding: 13% 8% 0; }
  .endcard .pc-ic { width: 46%; margin: auto; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .endcard .ec-why { font-size: max(12px, calc(var(--card-w) * .072)); font-weight: 650; line-height: 1.25; padding: 0 12%; }
  .endcard .pc-pp { font-size: max(11px, calc(var(--card-w) * .06)); white-space: normal; padding: 5% 8% 12%; }
  .banner .row { gap: 10px; }
  .more-row .btn { flex: 1 1 0; min-width: 0; padding: 0 8px; }
  .more-row .pf-open svg { flex: none; }
  .banner .row { flex-wrap: wrap; justify-content: center; }
  .banner .row .btn { min-width: 96px; box-shadow: 0 4px 12px rgba(0,0,0,.45); }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.8); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
  .flipstrip { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 55; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: max-content; max-width: calc(100vw - 24px); pointer-events: none; }
  /* drawn cards fly off their deck and turn face up, like flipping them over on the table */
  .flipstrip { perspective: 900px; gap: 8px; }
  .flipstrip .fcard { --card-w: 58px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.55)); }
  .flipstrip .fcard .tbl-face { width: 100%; height: 100%; }
  @media (min-width: 900px) { .flipstrip { top: 76px; } .flipstrip .fcard { --card-w: 80px; } }
  .flipstrip .fc { background: #1d3a2c; border: 1px solid #2f6b4f; color: #d6f5e3; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; animation: flip .4s ease-out both; box-shadow: 0 6px 18px rgba(0,0,0,.5); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .flipstrip .fc.epi { background: #3a1d1d; border-color: #7a3030; color: #ffd9d9; }
  @keyframes flip { from { transform: rotateX(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-width: 360px) { .stat { padding: 0 5px; } .status { gap: 4px; } }
</style>

<div id="app">
  <nav class="tabs" id="tabs">

    <button data-tab="play" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>Play</button>
    <button data-tab="table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/></svg>Table</button>
    <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>Study</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
